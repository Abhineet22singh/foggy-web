<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Foggy Mirror</title>

  <!-- MediaPipe: Hands only (fast, lightweight, smooth 60fps) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js" crossorigin="anonymous"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: #090a0d;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: 'Inter', sans-serif;
      color: #dde8f2; overflow: hidden; gap: 14px;
    }

    /* ── Top bar ── */
    .topbar { display:flex; align-items:center; gap:20px; }
    .logo {
      font-size:.88rem; font-weight:500;
      letter-spacing:4px; text-transform:uppercase; color:#8ec5fc;
      text-shadow: 0 0 12px rgba(142,197,252,0.3);
    }
    .gpills { display:flex; gap:8px; align-items:center; }
    .gpill {
      display:flex; align-items:center; gap:6px;
      font-size:.65rem; font-weight:500; letter-spacing:1px; text-transform:uppercase;
      padding:5px 14px; border-radius:20px;
      border:1px solid rgba(255,255,255,.1);
      color:rgba(255,255,255,.3); background:rgba(255,255,255,0.02);
      transition:all .25s ease; user-select:none;
    }
    .gpill .icon { font-size:.92rem; }
    .gpill.draw-on {
      color:#ffe0b2; border-color:rgba(255,190,100,.65);
      background:rgba(255,180,80,.14);
      box-shadow:0 0 16px rgba(255,180,80,.28);
    }
    .gpill.wipe-on {
      color:#a0dcff; border-color:rgba(100,195,255,.65);
      background:rgba(80,175,255,.14);
      box-shadow:0 0 16px rgba(80,175,255,.28);
    }

    /* ── Canvas stack ── */
    #wrap {
      position:relative; border-radius:16px; overflow:hidden;
      box-shadow:0 0 0 1px rgba(255,255,255,.1), 0 14px 90px rgba(0,0,0,.92);
      background: #000;
    }
    #wrap canvas { display:block; width:640px; height:480px; }
    #camCanvas  { position:relative; }
    #fogCanvas, #handCanvas, #uiCanvas {
      position:absolute; top:0; left:0; pointer-events:none;
    }

    /* ── Gesture label (top centre) ── */
    #gLabel {
      position:absolute; top:14px; left:50%; transform:translateX(-50%);
      font-size:.65rem; font-weight:500; letter-spacing:2px; text-transform:uppercase;
      padding:5px 16px; border-radius:20px;
      opacity:0; transition:opacity .25s;
      pointer-events:none; z-index:20; white-space:nowrap;
    }
    #gLabel.draw {
      opacity:1; color:#ffe0b2;
      background:rgba(10,12,18,.75); border:1px solid rgba(255,190,100,.45);
      box-shadow: 0 4px 18px rgba(0,0,0,0.5);
    }
    #gLabel.wipe {
      opacity:1; color:#a0dcff;
      background:rgba(10,12,18,.75); border:1px solid rgba(100,195,255,.45);
      box-shadow: 0 4px 18px rgba(0,0,0,0.5);
    }

    /* ── Guide (bottom) ── */
    #guide {
      position:absolute; bottom:0; left:0; right:0;
      padding:30px 20px 14px;
      background:linear-gradient(transparent,rgba(5,6,9,.75));
      display:flex; justify-content:center; gap:40px;
      pointer-events:none; z-index:5;
    }
    .gi { display:flex; flex-direction:column; align-items:center; gap:4px; }
    .gi span:first-child { font-size:1.35rem; }
    .gi span:last-child  { font-size:.58rem; letter-spacing:1px; text-transform:uppercase; color:rgba(255,255,255,.4); font-weight:500; }

    /* ── Loader ── */
    #loader {
      position:absolute; inset:0; background:rgba(9,10,13,.95);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:14px; z-index:40; border-radius:16px; transition:opacity .7s;
    }
    #loader.gone { opacity:0; pointer-events:none; }
    .spinner {
      width:38px; height:38px;
      border:3px solid rgba(142,197,252,.12); border-top-color:#8ec5fc;
      border-radius:50%; animation:spin .8s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    #loaderMsg { font-size:.8rem; color:#8ec5fc; letter-spacing:1.2px; font-weight:500; }
    #loaderSub { font-size:.64rem; color:#4a6275; }

    /* ── Controls ── */
    #controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center; }
    .cg {
      background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08);
      border-radius:10px; padding:7px 14px;
      display:flex; align-items:center; gap:10px;
      font-size:.7rem; color:#7e9eb5;
    }
    input[type="range"] {
      -webkit-appearance:none; width:74px; height:3px;
      background:rgba(142,197,252,.2); border-radius:2px; cursor:pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance:none; width:13px; height:13px;
      border-radius:50%; background:#8ec5fc; box-shadow:0 0 8px #8ec5fc; cursor:pointer;
    }
    .btn {
      background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.09);
      color:#8fc0e0; padding:7px 15px; border-radius:8px;
      font-size:.7rem; font-family:inherit; font-weight:500; cursor:pointer;
      transition:all .2s;
    }
    .btn:hover { background:rgba(142,197,252,.14); color:#cce7ff; box-shadow:0 0 12px rgba(142,197,252,.25); }
    #statusEl { font-size:.68rem; color:#425869; letter-spacing:.8px; min-height:16px; }
  </style>
</head>
<body>

<div class="topbar">
  <span class="logo">🪟 Foggy Mirror</span>
  <div class="gpills">
    <div class="gpill" id="pillDraw"><span class="icon">☝️</span>Draw</div>
    <div class="gpill" id="pillWipe"><span class="icon">🖐</span>Wipe</div>
  </div>
</div>

<div id="wrap">
  <canvas id="camCanvas"  width="640" height="480"></canvas>
  <canvas id="fogCanvas"  width="640" height="480"></canvas>
  <canvas id="handCanvas" width="640" height="480"></canvas>
  <canvas id="uiCanvas"   width="640" height="480"></canvas>

  <div id="gLabel"></div>

  <!-- Guide -->
  <div id="guide">
    <div class="gi"><span>☝️</span><span>index finger → draw</span></div>
    <div class="gi"><span>🖐</span><span>open palm + move → wipe</span></div>
  </div>

  <div id="loader">
    <div class="spinner"></div>
    <p id="loaderMsg">Starting camera…</p>
    <p id="loaderSub">Allow camera access when prompted</p>
  </div>
</div>

<div id="controls">
  <div class="cg"><span>Draw size</span><input type="range" id="drawSize" min="4" max="26" value="10"/></div>
  <div class="cg"><span>Fog thickness</span><input type="range" id="fogDensity" min="0.80" max="1.00" step="0.01" value="0.98"/></div>
  <div class="cg"><span>Re-fog speed</span><input type="range" id="refogSpeed" min="0" max="6" step="0.1" value="1.0"/></div>
  <button class="btn" id="clearBtn">🌫 Re-fog All</button>
  <button class="btn" id="snapBtn">📸 Snapshot</button>
</div>
<div id="statusEl">Initialising hand tracker…</div>

<video id="video" autoplay playsinline style="display:none"></video>

<script>
// ════════════════════════════════════════════════════
//  SETUP
// ════════════════════════════════════════════════════
const W=640, H=480;
const video      = document.getElementById('video');
const camCanvas  = document.getElementById('camCanvas');
const fogCanvas  = document.getElementById('fogCanvas');
const handCanvas = document.getElementById('handCanvas');
const uiCanvas   = document.getElementById('uiCanvas');
const wrap       = document.getElementById('wrap');
const loader     = document.getElementById('loader');
const loaderMsg  = document.getElementById('loaderMsg');
const statusEl   = document.getElementById('statusEl');
const gLabel     = document.getElementById('gLabel');
const pillDraw   = document.getElementById('pillDraw');
const pillWipe   = document.getElementById('pillWipe');
const drawSzIn   = document.getElementById('drawSize');
const fogDensIn  = document.getElementById('fogDensity');
const refogIn    = document.getElementById('refogSpeed');

const camCtx   = camCanvas.getContext('2d');
const fogCtx   = fogCanvas.getContext('2d');
const handCtx  = handCanvas.getContext('2d');
const uiCtx    = uiCanvas.getContext('2d');

// ════════════════════════════════════════════════════
//  FOG STATE — Solid, dense, thick fog layer
// ════════════════════════════════════════════════════
const fogAlpha   = new Float32Array(W*H).fill(1.0);
const smearAlpha = new Float32Array(W*H).fill(0.0);

// ════════════════════════════════════════════════════
//  VALUE NOISE — dense micro-droplet steam texture
// ════════════════════════════════════════════════════
const NGRID = new Float32Array(256*256);
for(let i=0;i<NGRID.length;i++) NGRID[i]=Math.random();
let noiseT=0;
function sn(px,py){
  const nx=((px*.11+noiseT*.12)|0)&255;
  const ny=((py*.11)|0)&255;
  return NGRID[nx+ny*256];
}

// ════════════════════════════════════════════════════
//  WATER LEAKS & DROPS (Thick condensation drips)
// ════════════════════════════════════════════════════
const drops=[];
function spawnDrop(x,y,sz){
  drops.push({
    x: x ?? (15 + Math.random()*(W-30)),
    y: y ?? (Math.random()*H*.35),
    r: sz ?? (2.4 + Math.random()*4.2),   // thicker droplet beads
    vy: .25 + Math.random()*.55,
    trail: []
  });
}
for(let i=0;i<24;i++) spawnDrop();

// ════════════════════════════════════════════════════
//  MAIN RENDER LOOP
// ════════════════════════════════════════════════════
function renderLoop(){
  noiseT += .004;

  // 1. Webcam feed — mirrored
  camCtx.save();
  camCtx.translate(W,0); camCtx.scale(-1,1);
  camCtx.drawImage(video,0,0,W,H);
  camCtx.restore();

  // 2. Thick Dense Fog Pixel Pass
  const density = parseFloat(fogDensIn.value); // default 0.98 for rich dense fog
  const img = fogCtx.createImageData(W,H);
  const d = img.data;

  for(let py=0; py<H; py++){
    for(let px=0; px<W; px++){
      const i = py*W + px;
      let a = fogAlpha[i];
      if(a < .004){ d[i*4+3]=0; continue; }

      const n = sn(px, py);
      // Cold, steamy, frosted white-blue condensation
      const r  = (226 + n * 18) | 0;
      const g  = (234 + n * 13) | 0;
      const bv = (244 + n * 7)  | 0;

      // Solid, thick opacity across the glass
      let fa = Math.min(1.0, a * density);

      // Smear marks from wiping leave authentic wet glass transparency
      const sm = smearAlpha[i];
      if(sm > .02 && fa > .02){
        fa = Math.max(fa * .015, sm * .42);
      }

      d[i*4]   = r;
      d[i*4+1] = g;
      d[i*4+2] = bv;
      d[i*4+3] = Math.round(fa * 255);
    }
  }
  fogCtx.putImageData(img,0,0);

  // 3. Thick Glass Sheen & Moisture Reflection
  const sheen = fogCtx.createLinearGradient(0, 0, W*.6, H*.6);
  sheen.addColorStop(0, 'rgba(255,255,255,.07)');
  sheen.addColorStop(0.5, 'rgba(220,240,255,.025)');
  sheen.addColorStop(1, 'rgba(255,255,255,0)');
  fogCtx.fillStyle = sheen;
  fogCtx.fillRect(0, 0, W, H);

  // 4. Render Thick Water Leaks / Condensation Runs
  renderDrops();

  requestAnimationFrame(renderLoop);
}

// ── Water leaks: drips carve realistic clear trails through thick fog ──
function renderDrops(){
  if(Math.random() < .016) spawnDrop();

  for(let i = drops.length - 1; i >= 0; i--){
    const dr = drops[i];
    dr.trail.push({x: dr.x, y: dr.y});
    if(dr.trail.length > 24) dr.trail.shift();

    dr.y += dr.vy;
    dr.vy += .011; // gravity acceleration
    dr.x += (Math.random() - .5) * .35; // gentle meandering drip

    // Real condensation physics: droplet carves a clear moisture trail through the fog
    const cx = dr.x | 0, cy = dr.y | 0;
    const fi = Math.min(W*H-1, Math.max(0, cy*W + cx));
    if(fogAlpha[fi] > 0.15){
      // Carve out a narrow clear leak trail in fogAlpha
      const trR = (dr.r * 0.7) | 0;
      for(let dy = -trR; dy <= trR; dy++){
        for(let dx = -trR; dx <= trR; dx++){
          const pxi = cx + dx, pyi = cy + dy;
          if(pxi >= 0 && pxi < W && pyi >= 0 && pyi < H){
            const pi = pyi * W + pxi;
            fogAlpha[pi] = Math.max(0.04, fogAlpha[pi] - 0.08);
          }
        }
      }
    }

    // Kill drop if it leaves bottom or runs off clear zone
    if(dr.y > H + 12 || (fogAlpha[fi] < .06 && dr.y > 60)){
      drops.splice(i, 1);
      continue;
    }

    // Render the clear water leak trail
    if(dr.trail.length > 2){
      fogCtx.beginPath();
      fogCtx.strokeStyle = 'rgba(175,220,250,.35)';
      fogCtx.lineWidth = dr.r * .75;
      fogCtx.lineCap = 'round';
      fogCtx.moveTo(dr.trail[0].x, dr.trail[0].y);
      dr.trail.forEach(p => fogCtx.lineTo(p.x, p.y));
      fogCtx.stroke();
    }

    // Render the glistening water droplet bead
    const g = fogCtx.createRadialGradient(
      dr.x - dr.r*.3, dr.y - dr.r*.35, 0,
      dr.x, dr.y, dr.r
    );
    g.addColorStop(0,   'rgba(255,255,255,0.98)');
    g.addColorStop(0.4, 'rgba(215,240,255,0.75)');
    g.addColorStop(0.85,'rgba(140,195,235,0.25)');
    g.addColorStop(1,   'rgba(100,165,210,0.02)');
    fogCtx.beginPath();
    fogCtx.arc(dr.x, dr.y, dr.r, 0, Math.PI*2);
    fogCtx.fillStyle = g;
    fogCtx.fill();
  }
}

// ════════════════════════════════════════════════════
//  RE-FOG TIMER
// ════════════════════════════════════════════════════
let refogTimer = null;
function scheduleRefog(){
  if(refogTimer) return;
  refogTimer = setInterval(()=>{
    const spd = parseFloat(refogIn.value);
    if(spd === 0) return;
    const inc = spd * .0025;
    let any = false;
    for(let i=0; i<fogAlpha.length; i++){
      if(fogAlpha[i] < 1.0){
        fogAlpha[i]   = Math.min(1.0, fogAlpha[i] + inc);
        smearAlpha[i] = Math.max(0, smearAlpha[i] - inc * .35);
        any = true;
      }
    }
    if(!any){ clearInterval(refogTimer); refogTimer = null; }
  }, 30);
}

// ════════════════════════════════════════════════════
//  ☝️  DRAW (index fingertip writes crisp lines)
// ════════════════════════════════════════════════════
function drawOnFog(cx,cy){
  const r = parseInt(drawSzIn.value), r2 = r*r;
  const x0 = Math.max(0, cx-r|0), x1 = Math.min(W-1, cx+r|0);
  const y0 = Math.max(0, cy-r|0), y1 = Math.min(H-1, cy+r|0);
  for(let py=y0; py<=y1; py++){
    for(let px=x0; px<=x1; px++){
      const dx=px-cx, dy=py-cy, d2=dx*dx+dy*dy;
      if(d2 > r2) continue;
      const sm = (1 - d2/r2)**3;
      const i = py*W + px, prev = fogAlpha[i];
      fogAlpha[i]   = Math.max(0, prev - sm * .98);
      smearAlpha[i] = Math.max(smearAlpha[i], sm * prev * .35);
    }
  }
  scheduleRefog();
}

// ════════════════════════════════════════════════════
//  🖐  WIPE (palm ellipse wipe on movement)
// ════════════════════════════════════════════════════
function wipePalm(cx, cy, rx, ry, angle){
  const cosA = Math.cos(-angle), sinA = Math.sin(-angle);
  const pad  = Math.max(rx, ry) + 4;
  const x0 = Math.max(0, (cx-pad)|0), x1 = Math.min(W-1, (cx+pad)|0);
  const y0 = Math.max(0, (cy-pad)|0), y1 = Math.min(H-1, (cy+pad)|0);
  for(let py=y0; py<=y1; py++){
    for(let px=x0; px<=x1; px++){
      const dx = px-cx, dy = py-cy;
      const lx = dx*cosA - dy*sinA, ly = dx*sinA + dy*cosA;
      const t  = (lx/rx)**2 + (ly/ry)**2;
      if(t > 1) continue;
      const str = (1 - t)**2;
      const i = py*W + px, prev = fogAlpha[i];
      fogAlpha[i]   = Math.max(0, prev - str * .90);
      smearAlpha[i] = Math.max(smearAlpha[i], str * prev * .45);
    }
  }
  scheduleRefog();
}

// ════════════════════════════════════════════════════
//  GESTURE CLASSIFIER (pure hand tracking)
// ════════════════════════════════════════════════════
function ext(lm, tip, pip){ return lm[tip].y < lm[pip].y - .02; }
function classifyHand(lm){
  const i = ext(lm, 8, 6),  m = ext(lm, 12, 10);
  const r = ext(lm, 16, 14), p = ext(lm, 20, 18);
  if( i && !m && !r && !p) return 'DRAW';
  if( i &&  m &&  r &&  p) return 'WIPE';
  return 'NONE';
}

// ════════════════════════════════════════════════════
//  UI HELPERS & SKELETON
// ════════════════════════════════════════════════════
const TIPS  = [4,8,12,16,20];
const BONES = [
  [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],
  [13,17],[0,17],[17,18],[18,19],[19,20]
];
const PALM_IDS   = [0,1,5,9,13,17];
const MIN_WIPE   = 3.0, MIN_DRAW = 0.5;
let prevPalm     = null, prevFinger = null;
let currentGesture = 'NONE';

function lmPt(lm, i){ return { x: (1 - lm[i].x)*W, y: lm[i].y*H }; }

function setGestureUI(g){
  currentGesture = g;
  gLabel.className = '';
  pillDraw.classList.remove('draw-on');
  pillWipe.classList.remove('wipe-on');
  if(g === 'DRAW'){
    gLabel.textContent = '☝️ Drawing';
    gLabel.className = 'draw';
    pillDraw.classList.add('draw-on');
  } else if(g === 'WIPE'){
    gLabel.textContent = '🖐 Wiping';
    gLabel.className = 'wipe';
    pillWipe.classList.add('wipe-on');
  }
}

function drawSkeleton(lm, gesture){
  const boneClr = gesture === 'DRAW' ? 'rgba(255,200,120,.55)'
                : gesture === 'WIPE' ? 'rgba(100,195,255,.50)'
                : 'rgba(140,180,210,.35)';
  const tipClr  = gesture === 'DRAW' ? 'rgba(255,225,160,.98)'
                : gesture === 'WIPE' ? 'rgba(170,225,255,.98)'
                : 'rgba(190,225,255,.75)';

  handCtx.save();
  handCtx.strokeStyle = boneClr; handCtx.lineWidth = 1.6; handCtx.lineCap = 'round';
  BONES.forEach(([a,b])=>{
    const pa = lmPt(lm,a), pb = lmPt(lm,b);
    handCtx.beginPath(); handCtx.moveTo(pa.x, pa.y); handCtx.lineTo(pb.x, pb.y); handCtx.stroke();
  });
  for(let i=0; i<21; i++){
    const p = lmPt(lm, i), r = TIPS.includes(i) ? 5.2 : 2.6;
    handCtx.beginPath(); handCtx.arc(p.x, p.y, r, 0, Math.PI*2);
    handCtx.fillStyle = TIPS.includes(i) ? tipClr : boneClr.replace('.55','.8').replace('.50','.8').replace('.35','.6');
    handCtx.fill();
  }
  handCtx.restore();
}

function drawFingertipCursor(x, y){
  const r = parseInt(drawSzIn.value);
  uiCtx.save();
  const g = uiCtx.createRadialGradient(x, y, 0, x, y, r + 12);
  g.addColorStop(0, 'rgba(255,210,120,.4)');
  g.addColorStop(1, 'rgba(255,210,120,0)');
  uiCtx.fillStyle = g; uiCtx.beginPath(); uiCtx.arc(x, y, r + 12, 0, Math.PI*2); uiCtx.fill();
  uiCtx.strokeStyle = 'rgba(255,220,140,.95)'; uiCtx.lineWidth = 1.6;
  uiCtx.beginPath(); uiCtx.arc(x, y, r, 0, Math.PI*2); uiCtx.stroke();
  uiCtx.fillStyle = 'rgba(255,245,200,.98)';
  uiCtx.beginPath(); uiCtx.arc(x, y, 2.8, 0, Math.PI*2); uiCtx.fill();
  uiCtx.restore();
}

// ════════════════════════════════════════════════════
//  HAND TRACKING RESULT HANDLER
// ════════════════════════════════════════════════════
function onHandResults(res){
  handCtx.clearRect(0, 0, W, H);
  uiCtx.clearRect(0, 0, W, H);

  if(!res.multiHandLandmarks?.length){
    setGestureUI('NONE');
    prevPalm = null; prevFinger = null;
    return;
  }

  const lm = res.multiHandLandmarks[0];
  const gesture = classifyHand(lm);
  setGestureUI(gesture);
  drawSkeleton(lm, gesture);

  const pts = PALM_IDS.map(i => lmPt(lm, i));
  const pcx = pts.reduce((s,p) => s + p.x, 0) / pts.length;
  const pcy = pts.reduce((s,p) => s + p.y, 0) / pts.length;
  const tip = lmPt(lm, 8); // index fingertip

  if(gesture === 'DRAW'){
    drawFingertipCursor(tip.x, tip.y);
    const vel = prevFinger ? Math.hypot(tip.x - prevFinger.x, tip.y - prevFinger.y) : 99;
    if(vel > MIN_DRAW){
      drawOnFog(tip.x, tip.y);
      if(prevFinger && vel > 3){
        const steps = Math.ceil(vel / parseInt(drawSzIn.value) * 1.5);
        for(let s=1; s<steps; s++){
          drawOnFog(
            prevFinger.x + (tip.x - prevFinger.x)*s/steps,
            prevFinger.y + (tip.y - prevFinger.y)*s/steps
          );
        }
      }
    }
    prevFinger = { x: tip.x, y: tip.y };
    prevPalm   = null;

  } else if(gesture === 'WIPE'){
    prevFinger = null;
    const wrist = lmPt(lm, 0), mid = lmPt(lm, 9);
    const pLen  = Math.hypot(mid.x - wrist.x, mid.y - wrist.y);
    const angle = Math.atan2(mid.y - wrist.y, mid.x - wrist.x);
    const rx = pLen * .78, ry = pLen * .56;
    const vel = prevPalm ? Math.hypot(pcx - prevPalm.x, pcy - prevPalm.y) : 0;

    if(vel > MIN_WIPE || !prevPalm){
      wipePalm(pcx, pcy, rx, ry, angle);
      if(prevPalm && vel > 5){
        const steps = Math.ceil(vel / (rx * .45));
        for(let s=1; s<steps; s++){
          wipePalm(
            prevPalm.x + (pcx - prevPalm.x)*s/steps,
            prevPalm.y + (pcy - prevPalm.y)*s/steps,
            rx, ry, angle
          );
        }
      }
    }

    // Dashed palm outline
    handCtx.save();
    handCtx.translate(pcx, pcy); handCtx.rotate(angle);
    handCtx.setLineDash([4, 6]);
    handCtx.strokeStyle = 'rgba(100,195,255,.25)'; handCtx.lineWidth = 1.2;
    handCtx.beginPath(); handCtx.ellipse(0, 0, rx, ry, 0, 0, Math.PI*2); handCtx.stroke();
    handCtx.restore();

    prevPalm = { x: pcx, y: pcy };

  } else {
    prevFinger = null; prevPalm = null;
  }
}

// ════════════════════════════════════════════════════
//  BUTTONS
// ════════════════════════════════════════════════════
document.getElementById('clearBtn').addEventListener('click', ()=>{
  fogAlpha.fill(1.0); smearAlpha.fill(0.0);
  if(refogTimer){ clearInterval(refogTimer); refogTimer = null; }
});

document.getElementById('snapBtn').addEventListener('click', ()=>{
  const m = document.createElement('canvas'); m.width = W; m.height = H;
  const mc = m.getContext('2d');
  mc.drawImage(camCanvas, 0, 0);
  mc.drawImage(fogCanvas, 0, 0);
  mc.drawImage(handCanvas, 0, 0);
  const a = document.createElement('a');
  a.download = `foggy-mirror-${Date.now()}.png`; a.href = m.toDataURL(); a.click();
});

// ════════════════════════════════════════════════════
//  START HAND TRACKING (Fast & Lightweight)
// ════════════════════════════════════════════════════
function startHands(){
  loaderMsg.textContent = 'Loading hand tracking model…';

  const hands = new Hands({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}`
  });
  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: .72,
    minTrackingConfidence: .62
  });
  hands.onResults(onHandResults);

  let isProcessing = false;
  const cam = new Camera(video, {
    onFrame: async () => {
      if(isProcessing) return;
      isProcessing = true;
      try {
        await hands.send({ image: video });
      } finally {
        isProcessing = false;
      }
    },
    width: W, height: H
  });

  cam.start().then(()=>{
    setTimeout(() => loader.classList.add('gone'), 1600);
    statusEl.textContent = '✅ Ready! ☝️ Index finger=Draw  🖐 Open palm=Wipe';
    requestAnimationFrame(renderLoop);
  }).catch(err => {
    loaderMsg.textContent = '❌ ' + err.message;
  });
}

// ════════════════════════════════════════════════════
//  BOOT
// ════════════════════════════════════════════════════
navigator.mediaDevices.getUserMedia({
  video: { width: W, height: H, facingMode: 'user' },
  audio: false
})
.then(stream => {
  video.srcObject = stream;
  video.play();
  startHands();
})
.catch(err => {
  loaderMsg.textContent = '❌ Camera: ' + err.message;
});
</script>
