<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Foggy Mirror</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js" crossorigin="anonymous"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap');
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: #0c0d10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      color: #e0e8f0;
      overflow: hidden;
      gap: 12px;
    }

    .topbar {
      display: flex; align-items: center; gap: 10px; opacity: 0.8;
    }
    .topbar h1 {
      font-size: 1rem; font-weight: 400;
      letter-spacing: 3px; text-transform: uppercase; color: #9ec8f5;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #f87171; box-shadow: 0 0 8px #f87171;
      transition: background 0.4s, box-shadow 0.4s;
    }
    .dot.active { background: #4ade80; box-shadow: 0 0 8px #4ade80; }

    /* ── Canvas stack ── */
    #wrap {
      position: relative;
      border-radius: 14px; overflow: hidden;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.09), 0 8px 60px rgba(0,0,0,0.7);
    }
    #wrap canvas {
      display: block; width: 640px; height: 480px;
    }
    #camCanvas  { position: relative; }
    #fogCanvas,
    #handCanvas { position: absolute; top:0; left:0; }

    /* ── Hand badge overlay ── */
    #hand-badge {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(78,222,128,0.5);
      color: #4ade80; font-size: 0.65rem;
      padding: 4px 14px; border-radius: 20px; letter-spacing: 1.5px;
      opacity: 0; transition: opacity 0.4s; pointer-events: none; z-index: 20;
    }
    #hand-badge.on { opacity: 1; }

    /* ── Instructions overlay ── */
    #instructions {
      position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.55); font-size: 0.68rem;
      padding: 5px 16px; border-radius: 20px; white-space: nowrap;
      letter-spacing: 0.8px; pointer-events: none; z-index: 20;
    }

    /* ── Loading overlay ── */
    #loader {
      position: absolute; inset: 0;
      background: rgba(12,13,16,0.88);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; z-index: 30; border-radius: 14px;
      transition: opacity 0.5s;
    }
    #loader.gone { opacity: 0; pointer-events: none; }
    .spinner {
      width: 38px; height: 38px;
      border: 3px solid rgba(126,184,247,0.15);
      border-top-color: #7eb8f7;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader p { font-size: 0.8rem; color: #7eb8f7; letter-spacing: 1px; }

    /* ── Controls ── */
    #controls {
      display: flex; gap: 10px;
      align-items: center; flex-wrap: wrap; justify-content: center;
    }
    .cg {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09);
      border-radius: 10px; padding: 7px 14px;
      display: flex; align-items: center; gap: 9px;
      font-size: 0.73rem; color: #8faabb;
    }
    input[type="range"] {
      -webkit-appearance: none; width: 80px; height: 3px;
      background: rgba(126,184,247,0.2); border-radius: 2px; outline: none; cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 12px; height: 12px;
      border-radius: 50%; background: #7eb8f7;
      box-shadow: 0 0 5px #7eb8f7; cursor: pointer;
    }
    .btn {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09);
      color: #9ec8f5; padding: 7px 15px; border-radius: 8px;
      font-size: 0.73rem; font-family: inherit; cursor: pointer;
      letter-spacing: 0.5px; transition: background 0.2s, box-shadow 0.2s;
    }
    .btn:hover { background: rgba(126,184,247,0.14); box-shadow: 0 0 12px rgba(126,184,247,0.2); }

    #statusEl {
      font-size: 0.7rem; color: #4a6275; letter-spacing: 1px; min-height: 16px;
    }
  </style>
</head>
<body>

<div class="topbar">
  <div class="dot" id="dot"></div>
  <h1>Foggy Mirror</h1>
</div>

<div id="wrap">
  <canvas id="camCanvas" width="640" height="480"></canvas>
  <canvas id="fogCanvas" width="640" height="480"></canvas>
  <canvas id="handCanvas" width="640" height="480"></canvas>

  <div id="hand-badge">✋ HAND DETECTED</div>
  <div id="instructions">🖐 Move your hand in front of the camera to wipe the fog</div>

  <!-- Loading overlay -->
  <div id="loader">
    <div class="spinner"></div>
    <p id="loaderMsg">Starting camera…</p>
  </div>
</div>

<div id="controls">
  <div class="cg">
    <span>Wipe Size</span>
    <input type="range" id="wipeSize" min="0.4" max="2.0" step="0.05" value="1.0"/>
  </div>
  <div class="cg">
    <span>Re-fog</span>
    <input type="range" id="refogSpeed" min="0" max="6" step="0.1" value="1.2"/>
  </div>
  <button class="btn" id="clearBtn">🌫 Re-fog All</button>
  <button class="btn" id="snapBtn">📸 Snapshot</button>
</div>

<div id="statusEl">Initialising…</div>

<video id="video" autoplay playsinline style="display:none"></video>

<script>
// ══════════════════════════════════════════
//  SETUP
// ══════════════════════════════════════════
const W = 640, H = 480;

const video      = document.getElementById('video');
const camCanvas  = document.getElementById('camCanvas');
const fogCanvas  = document.getElementById('fogCanvas');
const handCanvas = document.getElementById('handCanvas');
const camCtx     = camCanvas.getContext('2d');
const fogCtx     = fogCanvas.getContext('2d', { willReadFrequently: true });
const handCtx    = handCanvas.getContext('2d');
const dot        = document.getElementById('dot');
const badge      = document.getElementById('hand-badge');
const loader     = document.getElementById('loader');
const loaderMsg  = document.getElementById('loaderMsg');
const statusEl   = document.getElementById('statusEl');
const wipeSzInput = document.getElementById('wipeSize');
const refogInput  = document.getElementById('refogSpeed');
const clearBtn    = document.getElementById('clearBtn');
const snapBtn     = document.getElementById('snapBtn');

// ══════════════════════════════════════════
//  FOG STATE
// ══════════════════════════════════════════
const fogAlpha   = new Float32Array(W * H).fill(1.0);
const smearAlpha = new Float32Array(W * H).fill(0.0);

// ══════════════════════════════════════════
//  WATER DROPS
// ══════════════════════════════════════════
const drops = [];
function spawnDrop() {
  drops.push({
    x: 20 + Math.random() * (W - 40),
    y: Math.random() * H * 0.25,
    r: 2 + Math.random() * 4.5,
    vy: 0.25 + Math.random() * 0.55,
    trail: []
  });
}
for (let i = 0; i < 20; i++) spawnDrop();

// ══════════════════════════════════════════
//  VALUE NOISE (fast)
// ══════════════════════════════════════════
const NGRID = new Float32Array(128 * 128);
for (let i = 0; i < NGRID.length; i++) NGRID[i] = Math.random();
let noiseT = 0;
function sampleNoise(px, py) {
  const nx = ((px / W * 56 + noiseT * 0.2) | 0) & 127;
  const ny = ((py / H * 56)                | 0) & 127;
  return NGRID[nx + ny * 128];
}

// ══════════════════════════════════════════
//  RENDER LOOP
// ══════════════════════════════════════════
function renderLoop() {
  noiseT += 0.006;

  // 1. Webcam — mirrored
  camCtx.save();
  camCtx.translate(W, 0); camCtx.scale(-1, 1);
  camCtx.drawImage(video, 0, 0, W, H);
  camCtx.restore();

  // 2. Build fog pixel-by-pixel
  const img = fogCtx.createImageData(W, H);
  const d   = img.data;

  for (let py = 0; py < H; py++) {
    for (let px = 0; px < W; px++) {
      const i  = py * W + px;
      let   a  = fogAlpha[i];
      if (a <= 0.003) { d[i*4+3] = 0; continue; }

      const n   = sampleNoise(px, py);
      const r   = (218 + n * 16) | 0;
      const g   = (227 + n * 10) | 0;
      const b   = (238 + n *  5) | 0;

      // Edge vignette — thicker fog at border
      const vx   = (px / W - 0.5) * 2;
      const vy   = (py / H - 0.5) * 2;
      const vign = Math.min(1, 0.68 + 0.32 * (vx*vx + vy*vy) * 1.6);
      let   fa   = Math.min(1, a * vign);

      // Smear residue
      const sm = smearAlpha[i];
      if (sm > 0.02 && fa > 0.02) fa = Math.max(fa * 0.02, sm * 0.48);

      d[i*4]   = r;
      d[i*4+1] = g;
      d[i*4+2] = b;
      d[i*4+3] = Math.round(fa * 255);
    }
  }
  fogCtx.putImageData(img, 0, 0);

  // 3. Glass sheen
  const sheen = fogCtx.createLinearGradient(0, 0, W * 0.55, H * 0.55);
  sheen.addColorStop(0, 'rgba(255,255,255,0.05)');
  sheen.addColorStop(1, 'rgba(255,255,255,0.00)');
  fogCtx.fillStyle = sheen;
  fogCtx.fillRect(0, 0, W, H);

  // 4. Water drops
  renderDrops();

  requestAnimationFrame(renderLoop);
}

// ══════════════════════════════════════════
//  WATER DROPS RENDER
// ══════════════════════════════════════════
function renderDrops() {
  if (Math.random() < 0.015) spawnDrop();

  for (let i = drops.length - 1; i >= 0; i--) {
    const dr = drops[i];
    dr.trail.push({ x: dr.x, y: dr.y });
    if (dr.trail.length > 20) dr.trail.shift();
    dr.y  += dr.vy;
    dr.vy += 0.01;
    dr.x  += (Math.random() - 0.5) * 0.35;

    const fi = Math.min(W*H-1, (dr.y|0) * W + (dr.x|0));
    if (fogAlpha[fi] < 0.08) { drops.splice(i, 1); continue; }
    if (dr.y > H + 10)       { drops.splice(i, 1); continue; }

    // Trail
    if (dr.trail.length > 2) {
      fogCtx.beginPath();
      fogCtx.strokeStyle = 'rgba(175,210,238,0.32)';
      fogCtx.lineWidth   = dr.r * 0.65;
      fogCtx.lineCap     = 'round';
      fogCtx.moveTo(dr.trail[0].x, dr.trail[0].y);
      dr.trail.forEach(p => fogCtx.lineTo(p.x, p.y));
      fogCtx.stroke();
    }
    // Bead
    const grd = fogCtx.createRadialGradient(
      dr.x - dr.r * 0.3, dr.y - dr.r * 0.35, 0,
      dr.x, dr.y, dr.r
    );
    grd.addColorStop(0,   'rgba(255,255,255,0.92)');
    grd.addColorStop(0.4, 'rgba(200,225,245,0.6)');
    grd.addColorStop(1,   'rgba(140,185,220,0.15)');
    fogCtx.beginPath();
    fogCtx.arc(dr.x, dr.y, dr.r, 0, Math.PI * 2);
    fogCtx.fillStyle = grd;
    fogCtx.fill();
  }
}

// ══════════════════════════════════════════
//  WIPE FOG — palm-shaped ellipse
// ══════════════════════════════════════════
function wipeFogEllipse(cx, cy, rx, ry, angle) {
  const cosA = Math.cos(-angle), sinA = Math.sin(-angle);
  const mx = Math.round(cx), my = Math.round(cy);
  const pad = Math.max(rx, ry) + 2;
  const x0  = Math.max(0, mx - pad | 0);
  const x1  = Math.min(W - 1, mx + pad | 0);
  const y0  = Math.max(0, my - pad | 0);
  const y1  = Math.min(H - 1, my + pad | 0);

  for (let py = y0; py <= y1; py++) {
    for (let px = x0; px <= x1; px++) {
      const dx = px - cx, dy = py - cy;
      // Rotate into ellipse space
      const lx = dx * cosA - dy * sinA;
      const ly = dx * sinA + dy * cosA;
      const t  = (lx/rx)*(lx/rx) + (ly/ry)*(ly/ry);
      if (t > 1) continue;
      const strength = (1 - t) * (1 - t);   // smooth falloff
      const i = py * W + px;
      const prev = fogAlpha[i];
      fogAlpha[i]   = Math.max(0, prev - strength * 0.88);
      smearAlpha[i] = Math.max(smearAlpha[i], strength * prev * 0.42);
    }
  }
  scheduleRefog();
}

// Also used for mouse fallback (circular)
function wipeFogCircle(cx, cy, r) {
  wipeFogEllipse(cx, cy, r, r, 0);
}

// ══════════════════════════════════════════
//  RE-FOG
// ══════════════════════════════════════════
let refogTimer = null;
function scheduleRefog() {
  if (refogTimer) return;
  refogTimer = setInterval(() => {
    const spd = parseFloat(refogInput.value);
    if (spd === 0) return;
    const inc = spd * 0.0022;
    let any   = false;
    for (let i = 0; i < fogAlpha.length; i++) {
      if (fogAlpha[i] < 1.0) {
        fogAlpha[i]   = Math.min(1, fogAlpha[i]   + inc);
        smearAlpha[i] = Math.max(0, smearAlpha[i] - inc * 0.35);
        any = true;
      }
    }
    if (!any) { clearInterval(refogTimer); refogTimer = null; }
  }, 30);
}

// ══════════════════════════════════════════
//  HAND LANDMARKS → PALM WIPE REGION
//
//  We compute:
//   • Palm center  — average of wrist + 4 metacarpal bases
//   • Palm radius  — distance wrist → middle-finger base
//   • Aspect ratio — width vs height of palm bounding box
//   • Angle        — wrist → middle finger direction
//
//  Then wipe an ELLIPSE matching the palm shape.
//  Only wipe when hand is MOVING (velocity threshold).
// ══════════════════════════════════════════
let prevPalmPos   = null;
let handPresent   = false;
const MIN_VELOCITY = 2.5;  // px/frame to trigger wipe

// Landmark indices
const PALM_BASE = [0, 1, 5, 9, 13, 17];  // wrist + metacarpals
const FINGERTIPS = [4, 8, 12, 16, 20];
const CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[0,17],[17,18],[18,19],[19,20]
];

function lmToCanvas(lm, idx) {
  return { x: (1 - lm[idx].x) * W, y: lm[idx].y * H };
}

function onHandResults(results) {
  handCtx.clearRect(0, 0, W, H);

  if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
    if (handPresent) {
      handPresent = false;
      prevPalmPos = null;
      badge.classList.remove('on');
      dot.classList.remove('active');
    }
    return;
  }

  handPresent = true;
  badge.classList.add('on');
  dot.classList.add('active');

  const lm = results.multiHandLandmarks[0];

  // ── Palm center ──
  const palmPts = PALM_BASE.map(i => lmToCanvas(lm, i));
  const palmCx  = palmPts.reduce((s,p)=>s+p.x,0) / palmPts.length;
  const palmCy  = palmPts.reduce((s,p)=>s+p.y,0) / palmPts.length;

  // ── Palm size & angle (wrist → middle-finger base) ──
  const wrist   = lmToCanvas(lm, 0);
  const midBase = lmToCanvas(lm, 9);
  const palmLen = Math.hypot(midBase.x - wrist.x, midBase.y - wrist.y);
  const angle   = Math.atan2(midBase.y - wrist.y, midBase.x - wrist.x);

  // ── Wipe ellipse dimensions ──
  const scale  = parseFloat(wipeSzInput.value);
  const rx     = palmLen * 0.72 * scale;   // along fingers
  const ry     = palmLen * 0.52 * scale;   // across palm

  // ── Velocity gate — only wipe if palm is moving ──
  const vel = prevPalmPos
    ? Math.hypot(palmCx - prevPalmPos.x, palmCy - prevPalmPos.y)
    : 0;

  if (vel > MIN_VELOCITY || !prevPalmPos) {
    wipeFogEllipse(palmCx, palmCy, rx, ry, angle);

    // Fill path between frames for smooth stroke
    if (prevPalmPos && vel > 4) {
      const steps = Math.ceil(vel / (rx * 0.5));
      for (let s = 1; s < steps; s++) {
        const ix = prevPalmPos.x + (palmCx - prevPalmPos.x) * s / steps;
        const iy = prevPalmPos.y + (palmCy - prevPalmPos.y) * s / steps;
        wipeFogEllipse(ix, iy, rx, ry, angle);
      }
    }
  }
  prevPalmPos = { x: palmCx, y: palmCy };

  // ── Draw skeleton ──
  drawSkeleton(lm, palmCx, palmCy, rx, ry, angle);
}

function drawSkeleton(lm, pcx, pcy, rx, ry, angle) {
  handCtx.save();

  // Bones
  handCtx.strokeStyle = 'rgba(120,195,255,0.4)';
  handCtx.lineWidth   = 1.5;
  handCtx.lineCap     = 'round';
  for (const [a,b] of CONNECTIONS) {
    const pa = lmToCanvas(lm, a), pb = lmToCanvas(lm, b);
    handCtx.beginPath();
    handCtx.moveTo(pa.x, pa.y);
    handCtx.lineTo(pb.x, pb.y);
    handCtx.stroke();
  }

  // Joints
  for (let i = 0; i < 21; i++) {
    const p = lmToCanvas(lm, i);
    const r = FINGERTIPS.includes(i) ? 5 : 2.5;
    handCtx.beginPath();
    handCtx.arc(p.x, p.y, r, 0, Math.PI * 2);
    handCtx.fillStyle = FINGERTIPS.includes(i)
      ? 'rgba(200,235,255,0.95)'
      : 'rgba(100,175,255,0.7)';
    handCtx.fill();
  }

  // Palm wipe region outline (faint ellipse)
  handCtx.save();
  handCtx.translate(pcx, pcy);
  handCtx.rotate(angle);
  handCtx.strokeStyle = 'rgba(140,200,255,0.18)';
  handCtx.lineWidth   = 1;
  handCtx.setLineDash([4, 5]);
  handCtx.beginPath();
  handCtx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
  handCtx.stroke();
  handCtx.restore();

  handCtx.restore();
}

// ══════════════════════════════════════════
//  MOUSE FALLBACK (still works)
// ══════════════════════════════════════════
let mouseDown = false;
function getPos(e) {
  const rect = fogCanvas.getBoundingClientRect();
  const src  = e.touches ? e.touches[0] : e;
  return {
    x: (src.clientX - rect.left) * (W / rect.width),
    y: (src.clientY - rect.top)  * (H / rect.height)
  };
}
fogCanvas.addEventListener('mousedown',  e => { mouseDown = true; const p = getPos(e); wipeFogCircle(p.x, p.y, 36); });
fogCanvas.addEventListener('mousemove',  e => { if (mouseDown) { const p = getPos(e); wipeFogCircle(p.x, p.y, 36); } });
fogCanvas.addEventListener('mouseup',    () => mouseDown = false);
fogCanvas.addEventListener('mouseleave', () => mouseDown = false);
fogCanvas.addEventListener('touchstart', e => { e.preventDefault(); const p = getPos(e); wipeFogCircle(p.x, p.y, 36); }, { passive:false });
fogCanvas.addEventListener('touchmove',  e => { e.preventDefault(); const p = getPos(e); wipeFogCircle(p.x, p.y, 36); }, { passive:false });

// ══════════════════════════════════════════
//  BUTTONS
// ══════════════════════════════════════════
clearBtn.addEventListener('click', () => {
  fogAlpha.fill(1.0); smearAlpha.fill(0.0);
  if (refogTimer) { clearInterval(refogTimer); refogTimer = null; }
});
snapBtn.addEventListener('click', () => {
  const m = document.createElement('canvas');
  m.width = W; m.height = H;
  const mc = m.getContext('2d');
  mc.drawImage(camCanvas, 0, 0);
  mc.drawImage(fogCanvas, 0, 0);
  mc.drawImage(handCanvas, 0, 0);
  const a = document.createElement('a');
  a.download = `foggy-${Date.now()}.png`;
  a.href = m.toDataURL();
  a.click();
});

// ══════════════════════════════════════════
//  MEDIAPIPE INIT  (auto-start)
// ══════════════════════════════════════════
function startMediaPipe() {
  loaderMsg.textContent = 'Loading hand model…';

  const hands = new Hands({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}`
  });
  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.72,
    minTrackingConfidence: 0.60
  });
  hands.onResults(onHandResults);

  const cam = new Camera(video, {
    onFrame: async () => { await hands.send({ image: video }); },
    width: W, height: H
  });

  cam.start().then(() => {
    statusEl.textContent = '✅ Camera + hand tracking active — wave your hand to wipe fog!';
    // Wait a bit for model to load then hide loader
    setTimeout(() => { loader.classList.add('gone'); }, 1800);
    requestAnimationFrame(renderLoop);
  }).catch(err => {
    loaderMsg.textContent = '❌ Error: ' + err.message;
  });
}

// ══════════════════════════════════════════
//  START
// ══════════════════════════════════════════
navigator.mediaDevices.getUserMedia({ video: { width: W, height: H, facingMode: 'user' }, audio: false })
  .then(stream => {
    video.srcObject = stream;
    video.play();
    startMediaPipe();
  })
  .catch(err => {
    loaderMsg.textContent = '❌ Camera error: ' + err.message;
    statusEl.textContent  = err.message;
  });
</script>
</body>
</html>
